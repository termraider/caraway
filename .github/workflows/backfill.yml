name: Backfill from Internet Archive

# One-time history backfill. Each run fetches up to `max` archived snapshots and saves progress,
# so run it again until the log says "0 snapshots left".
on:
  workflow_dispatch:
    inputs:
      max:
        description: 'Snapshots to fetch this run'
        default: '1200'

permissions:
  contents: write
  pages: write # to ask Pages to republish after saving data

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Backfill
        env:
          MAX: ${{ github.event.inputs.max || '1200' }}
        run: node scraper/backfill.js
      - name: Save changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "caraway-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/wayback-observations.json "$RUNNER_TEMP/obs.json"
          for i in 1 2 3 4; do
            node scraper/check-data.js
            git add data
            if git diff --cached --quiet; then echo "No changes"; exit 0; fi
            git commit -q -m "Backfill from Internet Archive $(TZ=America/New_York date +%F)"
            if git push origin HEAD:main; then
              # Republish the site (bot pushes don't always start a Pages build on their own).
              gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null || echo "Pages rebuild request failed (site will update on the next push)"
              exit 0
            fi
            # main moved while we ran. Never text-merge the JSON: start from the newest main and re-merge this run into it.
            sleep $((i * 10))
            git fetch -q origin main && git reset -q --hard origin/main
            cp "$RUNNER_TEMP/obs.json" data/wayback-observations.json
            MERGE_ONLY=1 node scraper/backfill.js
          done
          exit 1
