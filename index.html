<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caraway Tracker</title>
<meta name="description" content="Every Caraway product and bundle with dated price history, sales, free gifts, what I own, and the cheapest way to buy my wishlist.">
<meta name="theme-color" content="#FBF7F0">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23FBF7F0'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%233E7653'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet">
<script>try{const t=localStorage.getItem('caraway-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
:root{
  --bg:#FBF7F0;--panel:#FFFFFF;--field:#F5EFE6;--line:#EAE1D4;--line2:#D9CCBA;
  --text:#4A4239;--hi:#2A241E;--dim:#857A6E;--ph:#A99D90;
  --green:#3E7653;--on-green:#FFFFFF;--gold:#C2592F;--on-gold:#FFFFFF;--accent:#B8452F;--butter:#F6E7B8;
  --tile-bg:#F3EEE6;--shadow:0 1px 2px rgba(60,40,20,.06),0 6px 18px rgba(60,40,20,.06);
  --s1:#3E7653;--s2:#C2592F;--s3:#3D5A80;--s4:#D49A2A;--s5:#8E5572;--s6:#7A7066;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1C1A17;--panel:#25221E;--field:#2D2A25;--line:#37322C;--line2:#4B443B;
  --text:#E6DED2;--hi:#FBF6EE;--dim:#A99F92;--ph:#7E7469;
  --green:#8FC29C;--on-green:#14261A;--gold:#EE9A6F;--on-gold:#2A140A;--accent:#F08A73;--butter:#4A3F22;
  --tile-bg:#EDE7DE;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  --s1:#8FC29C;--s2:#EE9A6F;--s3:#8FB3E0;--s4:#E8C060;--s5:#D39BC0;--s6:#B8AEA2;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C1A17;--panel:#25221E;--field:#2D2A25;--line:#37322C;--line2:#4B443B;
  --text:#E6DED2;--hi:#FBF6EE;--dim:#A99F92;--ph:#7E7469;
  --green:#8FC29C;--on-green:#14261A;--gold:#EE9A6F;--on-gold:#2A140A;--accent:#F08A73;--butter:#4A3F22;
  --tile-bg:#EDE7DE;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  --s1:#8FC29C;--s2:#EE9A6F;--s3:#8FB3E0;--s4:#E8C060;--s5:#D39BC0;--s6:#B8AEA2;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 'Nunito Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
a{color:var(--green);text-underline-offset:3px}a:hover{filter:brightness(1.15)}
h1,h2,h3{color:var(--hi);margin:0;line-height:1.15;font-family:'Fraunces',Georgia,serif;font-weight:700;letter-spacing:-.01em}
h1{font-size:34px}h2{font-size:24px}h3{font-size:18px}
button{font:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px}
header{border-bottom:1px solid var(--line);position:sticky;top:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);z-index:50}
nav{display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px;padding:12px 0}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--hi);font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:20px}
.brand i{width:30px;height:30px;border-radius:50%;background:var(--green);display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:16px;color:var(--on-green)}
.navlinks{display:flex;flex-wrap:wrap;gap:2px 6px;font-size:15px;font-weight:600}
.navlinks a{color:var(--dim);padding:7px 12px;text-decoration:none;border-radius:999px}
.navlinks a:hover{background:var(--field);filter:none}
.navlinks a[aria-current=page]{color:var(--hi);background:var(--field)}
.navlinks a .n{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:999px;background:var(--green);color:var(--on-green);font-size:12px;text-align:center}
.navlinks a .n:empty{display:none}
.tools{margin-left:auto;display:flex;align-items:center;gap:10px}
.sync{font-size:13px;color:var(--dim);text-decoration:none;font-weight:600}
.sync.on{color:var(--green)}.sync.err{color:var(--accent)}
.theme{width:38px;height:38px;border-radius:50%;border:1px solid var(--line2);background:var(--panel);color:var(--hi);cursor:pointer;font-size:17px;line-height:1}
main.wrap{padding-top:28px;padding-bottom:80px;min-height:70vh}
.eyebrow{margin:0 0 6px;color:var(--gold);font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.eyebrow a{color:inherit;text-decoration:none}
.sub{color:var(--dim);font-size:15px;margin:8px 0 0}
.sec{margin-top:36px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow)}
.banner{background:var(--butter);border-radius:16px;padding:14px 18px;margin:20px 0;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;color:var(--hi)}
.banner b{color:var(--gold)}
.f,select{-webkit-appearance:none;appearance:none;background:var(--panel);border:1px solid var(--line2);border-radius:12px;color:var(--hi);font:inherit;font-size:15px;height:44px;padding:0 14px;width:100%}
select{padding-right:32px;background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);background-position:calc(100% - 17px) 19px,calc(100% - 12px) 19px;background-size:5px 5px;background-repeat:no-repeat}
input::placeholder{color:var(--ph)}
input[type=checkbox]{accent-color:var(--green);width:18px;height:18px;margin:0;vertical-align:-3px}
.filters{display:grid;grid-template-columns:2fr repeat(3,minmax(140px,1fr));gap:12px;margin:20px 0 10px}
.fld{display:flex;flex-direction:column;gap:4px}.fld label{font-size:13px;color:var(--dim);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 18px;font-size:14px}
.chip{background:var(--panel);color:var(--text);border:1px solid var(--line2);border-radius:999px;padding:6px 14px;cursor:pointer;white-space:nowrap;font-weight:600}
.chip[aria-pressed=true]{background:var(--green);border-color:var(--green);color:var(--on-green)}
.count{color:var(--dim);font-size:14px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;position:relative;box-shadow:var(--shadow);transition:transform .15s}
.tile:hover{transform:translateY(-2px)}
.tile>a.cover{display:block;background:var(--tile-bg);aspect-ratio:4/3}
.tile>a.cover img{width:100%;height:100%;object-fit:contain;display:block}
.tile .tb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.tile .tk{font-size:12px;color:var(--dim);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.tile .tn{color:var(--hi);font-weight:800;font-size:16px;line-height:1.3;text-decoration:none}
.tile .tp{margin-top:auto;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;padding-top:6px}
.tile .tp b{font-size:21px;color:var(--hi)}
.tile .flags{position:absolute;top:10px;left:10px;display:flex;gap:6px;flex-wrap:wrap}
.strike{text-decoration:line-through;color:var(--dim)}
.badge{display:inline-block;font-weight:800;font-size:11px;letter-spacing:.04em;padding:3px 9px;border-radius:999px;text-transform:uppercase}
.b-green{background:var(--green);color:var(--on-green)}.b-red{background:var(--accent);color:#fff}.b-gold{background:var(--gold);color:var(--on-gold)}.b-line{border:1px solid var(--line2);color:var(--text);background:var(--panel)}
.dots{display:flex;gap:5px;flex-wrap:wrap}.dots i{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.15);display:inline-block}
.dots i.own{outline:2px solid var(--green);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:6px 16px;border-radius:999px;text-decoration:none;font-weight:700;border:1px solid var(--line2);color:var(--hi);background:var(--panel);cursor:pointer;font-size:14px}
.btn:hover{border-color:var(--green);filter:none}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--on-green)}
.btn.sm{min-height:32px;padding:3px 12px;font-size:13px}
.btn.on{border-color:var(--green);color:var(--green);background:color-mix(in srgb,var(--green) 12%,var(--panel))}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
table{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--dim);font-weight:700;padding:8px;border-bottom:1px solid var(--line2)}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.num,th.num{text-align:right}
.tablewrap{overflow-x:auto}
.detail{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:32px}
.detail .pic{background:var(--tile-bg);border-radius:20px;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;overflow:hidden}
.detail .pic img{width:100%;height:100%;object-fit:contain}
.colors{display:grid;gap:8px;margin-top:12px}
.crow{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:center;padding:9px 12px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.chart{width:100%;height:auto;display:block;margin-top:8px}
.chart text{fill:var(--dim);font:12px 'Nunito Sans',sans-serif}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--dim)}
.legend i{display:inline-block;width:14px;height:4px;border-radius:2px;margin-right:6px;vertical-align:middle}
.sol{border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin-top:14px;background:var(--panel);box-shadow:var(--shadow)}
.sol.best{border:2px solid var(--green)}
.sol .tot{font-size:28px;color:var(--hi);font-weight:800;font-family:'Fraunces',Georgia,serif}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.kv div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:9px 12px}
.kv span{display:block;font-size:12px;color:var(--dim);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.kv b{color:var(--hi);font-size:18px}
.tabs{display:flex;gap:6px;margin:16px 0}
.muted{color:var(--dim)}.green{color:var(--green)}.gold{color:var(--gold)}.red{color:var(--accent)}
.small{font-size:14px}
.empty{padding:40px 0;color:var(--dim)}
.picker{position:relative}
.picker .list{position:absolute;left:0;right:0;top:100%;z-index:40;background:var(--panel);border:1px solid var(--line2);border-radius:12px;max-height:320px;overflow:auto;margin-top:4px;box-shadow:var(--shadow)}
.picker .list button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--text);padding:9px 14px;cursor:pointer}
.picker .list button:hover{background:var(--field);color:var(--hi)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--hi);color:var(--bg);padding:9px 18px;border-radius:999px;font-weight:700;z-index:99;font-size:14px;box-shadow:var(--shadow)}
footer{border-top:1px solid var(--line);padding:18px 0 30px;color:var(--dim);font-size:13px}
@media (max-width:820px){
  .filters{grid-template-columns:1fr 1fr}.filters .fld:first-child{grid-column:1/-1}
  .detail{grid-template-columns:1fr}
  .wrap{padding:0 16px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .tile .tb{padding:10px}.tile .tn{font-size:14px}.tile .tp b{font-size:17px}
  .crow{grid-template-columns:1fr auto}
  header{position:static}
  h1{font-size:27px}
  .tools{margin-left:0}
}
</style>
</head>
<body>
<header><div class="wrap"><nav>
  <a class="brand" href="#/"><i aria-hidden="true">🍳</i>Caraway Tracker</a>
  <div class="navlinks">
    <a href="#/" data-nav="catalog">Catalog</a>
    <a href="#/sales" data-nav="sales">Sales &amp; gifts</a>
    <a href="#/kitchen" data-nav="kitchen">My kitchen<span class="n" id="nOwned"></span></a>
    <a href="#/wishlist" data-nav="wishlist">Wishlist<span class="n" id="nWish"></span></a>
  </div>
  <div class="tools"><a class="sync" id="syncLink" href="#/settings">Sync off</a><button class="theme" id="themeBtn" type="button" aria-label="Switch light or dark theme" title="Light or dark">☾</button></div>
</nav></div></header>
<main class="wrap" id="app"><p class="empty">Loading…</p></main>
<footer><div class="wrap">Prices scraped from carawayhome.com once a day. Sale math is an estimate of how Caraway's cart applies its tiers; check the cart before you buy. Not affiliated with Caraway. <span id="updated"></span></div></footer>
<script type="module" src="app.js"></script>
</body>
</html>
