<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caraway Tracker</title>
<meta name="description" content="Every Caraway product and bundle with dated price history, sales, free gifts, what I own, and the cheapest way to buy my wishlist.">
<meta name="theme-color" content="#050605">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23111A13'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%237CF29A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#050605;--panel:#0A100B;--field:#0B110C;--line:#1B2A1E;--line2:#2A4430;--text:#CFE8D3;--hi:#E6F5E8;--dim:#8FA894;--ph:#6F8A75;--green:#7CF29A;--gold:#FFD635;--accent:#FF3B2F}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{color-scheme:dark;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
a{color:var(--green)}a:hover{color:#B8FFC9}
h1,h2,h3{color:var(--hi);margin:0;line-height:1.15}
h1{font-size:30px}h2{font-size:22px}h3{font-size:17px}
button{font:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding:0 24px}
header{border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(5,6,5,.94);backdrop-filter:blur(6px);z-index:50}
nav{display:flex;flex-wrap:wrap;align-items:center;gap:8px 26px;padding:12px 0}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--hi);font-weight:700;font-size:17px}
.brand i{width:14px;height:14px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green)}
.navlinks{display:flex;flex-wrap:wrap;gap:2px 20px;font-size:14px}
.navlinks a{color:var(--dim);padding:8px 0;text-decoration:none;border-bottom:2px solid transparent}
.navlinks a[aria-current=page]{color:var(--hi);border-bottom-color:var(--green)}
.navlinks a .n{color:var(--green);font-size:12px;margin-left:3px}
.sync{margin-left:auto;font-size:12px;color:var(--dim);text-decoration:none}
.sync.on{color:var(--green)}.sync.err{color:var(--accent)}
main.wrap{padding-top:26px;padding-bottom:80px;min-height:70vh}
.prompt{margin:0 0 4px;color:var(--dim);font-size:13px}
.sub{color:var(--dim);font-size:14px;margin:6px 0 0}
.sec{margin-top:36px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.banner{background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:14px 18px;margin:18px 0;display:flex;flex-wrap:wrap;gap:6px 22px;align-items:center}
.banner b{color:var(--gold)}
.f,select{-webkit-appearance:none;appearance:none;background:var(--field);border:1px solid var(--line2);border-radius:6px;color:var(--hi);font:inherit;font-size:15px;height:42px;padding:0 12px;width:100%}
select{padding-right:28px;background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);background-position:calc(100% - 15px) 18px,calc(100% - 10px) 18px;background-size:5px 5px;background-repeat:no-repeat}
input[type=checkbox]{accent-color:var(--green);width:17px;height:17px;margin:0;vertical-align:-3px}
.filters{display:grid;grid-template-columns:2fr repeat(3,minmax(140px,1fr));gap:12px;margin:18px 0 10px}
.fld{display:flex;flex-direction:column;gap:3px}.fld label{font-size:12px;color:var(--dim)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 16px;font-size:13px}
.chip{background:transparent;color:var(--text);border:1px solid var(--line2);border-radius:4px;padding:6px 11px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--green);border-color:var(--green);color:#04130A;font-weight:600}
.count{color:var(--dim);font-size:13px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.tile:hover{border-color:var(--line2)}
.tile>a.cover{display:block;background:#f3efe8;aspect-ratio:4/3}
.tile>a.cover img{width:100%;height:100%;object-fit:contain;display:block}
.tile .tb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:3px;flex:1}
.tile .tk{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.tile .tn{color:var(--hi);font-weight:700;font-size:15px;line-height:1.3;text-decoration:none}
.tile .tp{margin-top:auto;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;padding-top:6px}
.tile .tp b{font-size:20px;color:var(--green)}
.tile .flags{position:absolute;top:8px;left:8px;display:flex;gap:6px;flex-wrap:wrap}
.strike{text-decoration:line-through;color:var(--dim)}
.sale{color:var(--gold)}
.badge{display:inline-block;font-weight:700;font-size:11px;letter-spacing:.06em;padding:2px 8px;border-radius:4px;text-transform:uppercase}
.b-green{background:var(--green);color:#04130A}.b-red{background:var(--accent);color:#fff}.b-gold{background:var(--gold);color:#141414}.b-line{border:1px solid var(--line2);color:var(--text);background:var(--bg)}
.dots{display:flex;gap:4px;flex-wrap:wrap}.dots i{width:12px;height:12px;border-radius:50%;border:1px solid var(--line2);display:inline-block}
.dots i.own{outline:2px solid var(--green);outline-offset:1px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:6px 14px;border-radius:7px;text-decoration:none;font-weight:600;border:1px solid var(--line2);color:var(--hi);background:transparent;cursor:pointer;font-size:14px}
.btn:hover{border-color:var(--green);color:var(--hi)}
.btn.primary{background:var(--green);border-color:var(--green);color:#04130A}
.btn.sm{min-height:30px;padding:3px 10px;font-size:13px}
.btn.on{border-color:var(--green);color:var(--green)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line2)}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.num,th.num{text-align:right}
.tablewrap{overflow-x:auto}
.detail{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:28px}
.detail .pic{background:#f3efe8;border-radius:12px;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;overflow:hidden}
.detail .pic img{width:100%;height:100%;object-fit:contain}
.colors{display:grid;gap:8px;margin-top:14px}
.crow{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.chart{width:100%;height:auto;display:block;margin-top:8px}
.chart text{fill:var(--dim);font:11px 'IBM Plex Mono',monospace}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--dim)}
.legend i{display:inline-block;width:12px;height:3px;margin-right:6px;vertical-align:middle}
.sol{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:12px;background:var(--panel)}
.sol.best{border-color:var(--green)}
.sol .tot{font-size:24px;color:var(--green);font-weight:700}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0}
.kv div{background:var(--field);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.kv span{display:block;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.kv b{color:var(--hi)}
.tabs{display:flex;gap:6px;margin:16px 0}
.muted{color:var(--dim)}.green{color:var(--green)}.gold{color:var(--gold)}.red{color:var(--accent)}
.small{font-size:13px}
.empty{padding:40px 0;color:var(--dim)}
.picker{position:relative}
.picker .list{position:absolute;left:0;right:0;top:100%;z-index:40;background:var(--panel);border:1px solid var(--line2);border-radius:8px;max-height:320px;overflow:auto;margin-top:4px}
.picker .list button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--text);padding:8px 12px;cursor:pointer}
.picker .list button:hover{background:var(--field);color:var(--hi)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--green);color:#04130A;padding:8px 16px;border-radius:8px;font-weight:600;z-index:99;font-size:14px}
footer{border-top:1px solid var(--line);padding:18px 0 30px;color:var(--dim);font-size:12px}
@media (max-width:820px){
  .filters{grid-template-columns:1fr 1fr}.filters .fld:first-child{grid-column:1/-1}
  .detail{grid-template-columns:1fr}
  .wrap{padding:0 16px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .tile .tb{padding:10px}
  .tile .tp b{font-size:17px}
  header{position:static}
  .crow{grid-template-columns:1fr auto;}
  h1{font-size:24px}
}
</style>
</head>
<body>
<header><div class="wrap"><nav>
  <a class="brand" href="#/"><i></i>caraway.tracker</a>
  <div class="navlinks">
    <a href="#/" data-nav="catalog">Catalog</a>
    <a href="#/sales" data-nav="sales">Sales &amp; gifts</a>
    <a href="#/kitchen" data-nav="kitchen">My kitchen<span class="n" id="nOwned"></span></a>
    <a href="#/wishlist" data-nav="wishlist">Wishlist<span class="n" id="nWish"></span></a>
  </div>
  <a class="sync" id="syncLink" href="#/settings">sync: off</a>
</nav></div></header>
<main class="wrap" id="app"><p class="empty">Loading…</p></main>
<footer><div class="wrap">Prices scraped from carawayhome.com once a day. Sale math is an estimate of how Caraway's cart applies its tiers; check the cart before you buy. Not affiliated with Caraway. <span id="updated"></span></div></footer>
<script type="module" src="app.js"></script>
</body>
</html>
