name: Scrape Caraway

on:
  # When it runs. To change the schedule, edit this one line (it is UTC: 11:17 UTC = 6:17 AM Eastern in winter).
  # Examples: '17 11 * * *' daily · '17 11,23 * * *' twice a day · '17 11 * * 1' Mondays only.
  schedule:
    - cron: '17 11 * * *'
  # "Run workflow" button on the Actions tab.
  workflow_dispatch:
    inputs:
      limit:
        description: 'Only scrape the first N products (0 = all)'
        default: '0'

permissions:
  contents: write
  pages: write # to ask Pages to republish after saving data

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Scrape
        env:
          LIMIT: ${{ github.event.inputs.limit || '0' }}
        run: node scraper/scrape.js

      - name: Save changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "caraway-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Caraway data $(TZ=America/New_York date +%F)"
          for i in 1 2 3 4; do
            if git pull --rebase -X theirs origin main && git push origin HEAD:main; then
              # Republish the site (bot pushes don't always start a Pages build on their own).
              gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null || echo "Pages rebuild request failed (site will update on the next push)"
              exit 0
            fi
            sleep $((i * 10))
          done
          exit 1
